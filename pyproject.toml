[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.141",
    "uvicorn>=0.30",
    "pydantic-settings>=2.14",
    "pymilvus>=3.0",
    "pypdf>=6.0",
    "neo4j>=6.0",
    "pyyaml>=6.0",
    "langgraph>=1.2",
    "aiosqlite>=0.22",
    "python-multipart>=0.0.20",
    "python-docx>=1.2",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
    "dashscope>=1.20",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "reportlab>=5.0",
    "xlwt>=1.3",
]
# 只有启用 session_window_backend="redis" 时才需要——
# app/memory/session_window_factory.py 里对应分支是运行时 lazy import
# （if backend == "redis": import redis.asyncio as redis），特意不在
# 模块顶层引入，就是为了不强制所有部署都装这个包；这里的 optional
# extra 声明要和那处 lazy import 的意图保持一致，不能反过来把它列进
# 主 dependencies 强制安装。
redis = [
    "redis>=5.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
