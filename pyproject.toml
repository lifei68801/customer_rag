[project]
name = "customer-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.141",
    "uvicorn>=0.30",
    "pydantic-settings>=2.14",
    "pymilvus>=3.0",
    "pypdf>=6.0",
    "neo4j>=6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "reportlab>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
